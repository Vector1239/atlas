url = "https://www.reddit.com/r/Trier/.rss"

[[news]]
name = "Google News: Luxembourg (English)"
ring = 1
lang = "en"
url = "https://news.google.com/rss/search?q=Luxembourg+when:1d&hl=en-GB&gl=GB&ceid=GB:en"

[[news]]
name = "Google News: Rheinland-Pfalz & Saarland"
