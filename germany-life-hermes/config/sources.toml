# Germany-life sources. Edit freely; the scripts reread this file on every run.
#
# Rings: 0 = Trier, 1 = region (Luxembourg, Saarland, Rhineland-Palatinate),
#        2 = Germany, 3 = Europe.
#
# These sources could not be tested when this file was written. Run `./gl check`
# once on your Mac, then fix or delete (or set enabled = false on) anything that fails.

[home]
city = "Trier"
lat = 49.7499
lon = 6.6371
# Uni Trier, Campus I (Tarforst), used to find the nearest Mensa on OpenMensa.
uni_lat = 49.7466
uni_lon = 6.6873
timezone = "Europe/Berlin"

[brief]
news_hours = 30          # how far back to look (72 h on Mondays)
max_per_feed = 6
mensa_radius_km = 6
mensa_max = 2            # how many canteens to show
mensa_name_filter = ""   # e.g. "Tarforst" to show only that one

# ------------------------------------------------------------------ news
# Google News searches are the backbone: one URL format, any place or topic.
# `lang` is the language of the headlines; the agent translates German ones.

[[news]]
name = "Google News: Trier"
ring = 0
lang = "de"
url = "https://news.google.com/rss/search?q=Trier+when:2d&hl=de&gl=DE&ceid=DE:de"

[[news]]
name = "Google News: Universität Trier"
ring = 0
lang = "de"
url = "https://news.google.com/rss/search?q=%22Universit%C3%A4t+Trier%22+when:7d&hl=de&gl=DE&ceid=DE:de"

[[news]]
name = "16vor (Trier local news)"
ring = 0
lang = "de"
url = "https://www.16vor.de/feed/"

[[news]]
name = "Trierischer Volksfreund"
ring = 0
lang = "de"
url = "https://www.volksfreund.de/feed.rss"

[[news]]
name = "r/Trier"
ring = 0
