# ------------------------------------------------------------------ jobs

[jobs]
max_age_days = 14            # ignore older postings
max_items_per_run = 30       # cap what the agent sees per run
exclude_temp_agencies = true # Bundesagentur: drop Zeitarbeit postings

# A job is kept only if its title (or category/tags) matches one of these
# (case-insensitive regular expressions). Data/AI roles and software roles of every kind.
include = [
  # data & AI
  '\bdata\b', 'daten(?!schutz)', 'machine learning', '\bml\b', '\bai\b', '\bki\b',
  'künstliche intelligenz', 'analy', 'statisti', 'python', 'business intelligence',
  '\bbi\b', '\bnlp\b', 'deep learning', '\bllm', 'computer vision', 'forecast',
  'data scien', 'data engineer', 'prompt engineer', 'mlops',
  # software engineering: full stack, web, backend, mobile, cloud
  'software', 'developer', 'entwickler', 'programmier', 'informatik', 'full.?stack',
  'front.?end', 'back.?end', 'web.?(?:develop|entwickl|engineer)', 'mobile.?(?:app|dev|engineer|entwickl|software)', 'app.?develop', '\bios\b',
  'android', 'flutter', 'react', 'angular', '\bvue', 'node\.?js', 'typescript', 'javascript',
  '\bjava\b', 'kotlin', '\bswift\b', 'golang', '\.net\b', 'c\+\+', 'devops', '\bcloud\b',
  'platform engineer', 'site reliability', '\bsre\b', 'app.?entwickl', 'test automat', '\bqa engineer',
  # university
  'hilfskraft', '\bhiwi\b', 'research assistant',
]
# ...and dropped if its title matches one of these (also: no cybersecurity roles).
exclude = [
  'ausbildung', 'pflege', 'fahrer', 'lager', 'verkäuf', 'kassier', 'reinigung',
  'datenschutz', 'erfassung', 'business develop', 'personalentwickl', 'produktentwickl',
  'security', 'sicherheit', 'cyber', 'pentest', 'penetration', '\bsoc\b', '\bsiem\b', 'forensi',
]
student = ['werkstudent', 'working student', 'studentische', 'hilfskraft', '\bhiwi\b',
           'praktik', '\bintern', 'thesis', 'abschlussarbeit', 'masterarbeit']
senior = ['senior', '\blead\b', 'principal', 'head of', 'leiter', 'director', '\bstaff\b']
german_required = ['fließend deutsch', 'verhandlungssicher', 'deutsch.{0,20}\b(c1|c2)\b',
                   'sehr gute deutschkenntnisse', 'fluent german', 'native german',
                   'german.{0,20}\b(c1|c2)\b', 'deutsch als muttersprache']

# City names that put a job into ring 0 or 1 (for sources without a radius search).
ring0_places = ["Trier", "Konz", "Schweich", "Saarburg", "Bitburg", "Wittlich", "Hermeskeil"]
ring1_places = ["Luxembourg", "Luxemburg", "Esch", "Kirchberg", "Saarbrücken", "Saarlouis",
                "Homburg", "Merzig", "Kaiserslautern", "Koblenz", "Mainz", "Idar-Oberstein",
                "Wiesbaden", "Ludwigshafen", "Mannheim"]

# Bundesagentur für Arbeit (official German job board, free, no sign-up).
[[jobs.bundesagentur]]
ring = 0
where = "Trier"
radius_km = 50
queries = ["Data Science", "Data Analyst", "Machine Learning", "Werkstudent Data",
           "Werkstudent Informatik", "Python", "Business Intelligence", "Statistik",
           "Wissenschaftliche Hilfskraft", "Softwareentwickler", "Werkstudent Softwareentwicklung",
           "Full Stack", "App Entwickler", "Künstliche Intelligenz"]

[[jobs.bundesagentur]]
ring = 1
where = "Trier"
radius_km = 150
queries = ["Data Scientist", "Data Analyst", "Machine Learning", "Werkstudent Data Science",
           "Data Engineer", "Software Engineer", "Werkstudent Software", "Full Stack Developer",
           "AI Engineer", "Mobile Developer"]

[[jobs.bundesagentur]]
ring = 2
where = ""   # all of Germany
queries = ["Junior Data Scientist", "Werkstudent Data Science", "Junior Data Analyst",
           "Junior Machine Learning Engineer", "Graduate Data Scientist", "Junior Software Engineer",
           "Werkstudent Softwareentwicklung", "Junior Full Stack Developer", "Junior Frontend Developer",
           "Junior Backend Developer", "Junior Mobile Developer", "AI Engineer"]

# Arbeitnow (Germany-focused board with a visa-sponsorship filter; free, no key).
# Rings come from ring0_places / ring1_places; everything else is ring 2.
[jobs.arbeitnow]
enabled = true
pages = 3          # general listings, ~100 per page
visa_pages = 2     # extra pages from the visa-sponsorship feed

# Remote boards (free, no key): Remotive, Jobicy and Himalayas. Listings link back to the board,
# as their terms require. Only roles you may take while living in Germany are kept (any company,
# including US ones hiring worldwide); "USA only" style roles are skipped. Each request is cached
# 12 hours (Remotive asks for at most 4 requests a day, Jobicy for one sync an hour).
[jobs.remote]
enabled = true
remotive_categories = ["data", "software-dev"]
jobicy_industries = ["data-science", "engineering"]
jobicy_geos = ["europe", "anywhere"]
himalayas_queries = ["data scientist", "data analyst", "data engineer", "machine learning", "ai engineer",
                     "software engineer", "full stack", "frontend", "backend", "mobile developer"]
himalayas_country = "DE"   # Himalayas returns roles open to this country plus worldwide ones

# Optional JSearch, as used by Dossier. OpenWeb Ninja has a free, hard-limited plan.
# Add a key in Atlas Settings → Sources; no key is needed for the sources above.
# Requests are manual: use Search JSearch now in Settings → Sources.
# Keep enabled=false so older app/cron versions cannot spend credits automatically.
# One page per search, cached 24 hours; Atlas caps requests at 180 per UTC month.
[jobs.jsearch]
enabled = false

[[jobs.jsearch.searches]]
ring = 0
country = "de"
what = "Werkstudent Data Science"
where = "Trier"
radius_km = 50
language = "de"

[[jobs.jsearch.searches]]
ring = 1
country = "lu"
what = "junior data scientist"
where = "Luxembourg"
radius_km = 50

[[jobs.jsearch.searches]]
ring = 2
country = "de"
what = "Werkstudent Data Science"
where = "Germany"
language = "de"

[[jobs.jsearch.searches]]
ring = 3
country = "nl"
what = "junior data scientist"
where = "Netherlands"

[[jobs.jsearch.searches]]
ring = 3
country = "at"
what = "junior data scientist"
where = "Austria"
language = "de"

[[jobs.jsearch.searches]]
ring = 3
country = "be"
what = "junior data scientist"
where = "Belgium"
