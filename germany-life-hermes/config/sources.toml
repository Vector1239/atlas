# ------------------------------------------------------------------ jobs

[jobs]
max_age_days = 14            # ignore older postings
max_items_per_run = 30       # cap what the agent sees per run
exclude_temp_agencies = true # Bundesagentur: drop Zeitarbeit postings

# A job is kept only if its title (or category/tags) matches one of these
# (case-insensitive regular expressions).
include = [
  '\bdata\b', 'daten(?!schutz)', 'machine learning', '\bml\b', '\bai\b', '\bki\b',
  'künstliche intelligenz', 'analy', 'statisti', 'python', 'business intelligence',
  '\bbi\b', '\bnlp\b', 'deep learning', '\bllm', 'computer vision', 'forecast',
  'data scien', 'data engineer', 'hilfskraft', '\bhiwi\b', 'research assistant',
]
# ...and dropped if its title matches one of these.
exclude = [
  'ausbildung', 'pflege', 'fahrer', 'lager', 'verkäuf', 'kassier', 'reinigung',
  'datenschutz', 'erfassung',
]
student = ['werkstudent', 'working student', 'studentische', 'hilfskraft', '\bhiwi\b',
           'praktik', '\bintern', 'thesis', 'abschlussarbeit', 'masterarbeit']
senior = ['senior', '\blead\b', 'principal', 'head of', 'leiter', 'director', '\bstaff\b']
german_required = ['fließend deutsch', 'verhandlungssicher', 'deutsch.{0,20}\b(c1|c2)\b',
                   'sehr gute deutschkenntnisse', 'fluent german', 'native german',
                   'german.{0,20}\b(c1|c2)\b', 'deutsch als muttersprache']

# City names that put a job into ring 0 or 1 (for sources without a radius search).
ring0_places = ["Trier", "Konz", "Schweich", "Saarburg", "Bitburg", "Wittlich", "Hermeskeil"]
ring1_places = ["Luxembourg", "Luxemburg", "Esch", "Kirchberg", "Saarbrücken", "Saarlouis",
                "Homburg", "Merzig", "Kaiserslautern", "Koblenz", "Mainz", "Idar-Oberstein",
                "Wiesbaden", "Ludwigshafen", "Mannheim"]

# Bundesagentur für Arbeit (official German job board, free, no sign-up).
[[jobs.bundesagentur]]
ring = 0
where = "Trier"
radius_km = 50
queries = ["Data Science", "Data Analyst", "Machine Learning", "Werkstudent Data",
           "Werkstudent Informatik", "Python", "Business Intelligence", "Statistik",
           "Wissenschaftliche Hilfskraft"]

[[jobs.bundesagentur]]
ring = 1
where = "Trier"
radius_km = 150
queries = ["Data Scientist", "Data Analyst", "Machine Learning", "Werkstudent Data Science",
           "Data Engineer"]

[[jobs.bundesagentur]]
ring = 2
where = ""   # all of Germany
queries = ["Junior Data Scientist", "Werkstudent Data Science", "Junior Data Analyst",
           "Junior Machine Learning Engineer", "Graduate Data Scientist"]

# Arbeitnow (Germany-focused board with a visa-sponsorship filter; free, no key).
# Rings come from ring0_places / ring1_places; everything else is ring 2.
[jobs.arbeitnow]
enabled = true
pages = 3          # general listings, ~100 per page
visa_pages = 2     # extra pages from the visa-sponsorship feed

# Adzuna (optional): free key from https://developer.adzuna.com. Put ADZUNA_APP_ID and
# ADZUNA_APP_KEY in ~/.hermes/.env and list both under terminal.env_passthrough in
# ~/.hermes/config.yaml (see SETUP-macOS.md). Skipped without a key.
[[jobs.adzuna]]
ring = 1
country = "de"
what = "data"
where = "Trier"
radius_km = 150

[[jobs.adzuna]]
ring = 3
country = "nl"
what = "junior data scientist"

[[jobs.adzuna]]
ring = 3
country = "at"
what = "junior data scientist"

[[jobs.adzuna]]
ring = 3
country = "be"
what = "junior data scientist"
